<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本文ブロックの確認</title>
<style>
body{font:16px system-ui;margin:2rem auto;padding:0 1rem;max-width:880px;background:#181b20;color:#f4f6f8}
select,button{font:inherit;padding:.4rem;margin:.2rem}canvas{width:100%;background:#222;border:1px solid #707985}
fieldset{margin:1rem 0;display:flex;flex-wrap:wrap;gap:.4rem}label{white-space:nowrap}
</style>
<h1>本文ブロックの確認</h1>
<p>番号の付いた箱の役割を選びます。文字の欠落や複数ブロックの結合があるコマは保留にしてください。</p>
<label>素材 <select id="work"></select></label>
<label>コマ <select id="frame"></select></label>
<button id="previous">前のコマ</button><button id="next">次のコマ</button>
<canvas id="image" width="640" height="360"></canvas>
<fieldset id="fields"></fieldset>
<button id="save">役割の判定を書き出す</button> <output id="status"></output>
<script>
const bundle = /* CANDIDATE_DATA */ null;
const $ = id => document.getElementById(id);
const types = [['lyric','本文'],['ruby','ルビ'],['subtitle','字幕'],['graphic','図形'],['frame','枠'],['discard','その他']];
const records = {};
const storageKey = 'mlm-text-review:' + bundle.reviewId;
try { Object.assign(records,JSON.parse(localStorage.getItem(storageKey) || '{}')); } catch {}
const option = (value,label) => new Option(label,value);
for(const work of bundle.works) $('work').add(option(work.label,work.label));
const currentWork = () => bundle.works[$('work').selectedIndex];
const currentFrame = () => currentWork().frames[$('frame').selectedIndex];
function updateFrames() {
  $('frame').replaceChildren(...currentWork().frames.map(frame => option(frame.frame,frame.frame+'F')));
  show();
}
function change(direction) {
  const next = $('frame').selectedIndex+direction;
  if(next>=0 && next<currentWork().frames.length) { $('frame').selectedIndex=next; show(); }
}
function show() {
  const work=currentWork(), frame=currentFrame();
  const index=$('frame').selectedIndex;
  const key=work.label+'/'+frame.frame;
  const decisions = records[key] ||= {status:'',roles:Array(frame.blocks.length).fill('')};
  const still=new Image();
  still.onload=()=> {
    if(currentWork()!==work || currentFrame()!==frame) return;
    const context=$('image').getContext('2d');
    context.drawImage(still,index%4*320,Math.floor(index/4)*207+23,320,180,0,0,640,360);
  };
  still.src=work.label+'-grid.jpg';
  const keep = () => { try { localStorage.setItem(storageKey,JSON.stringify(records)); } catch {} };
  const state=document.createElement('select');
  for(const [value,label] of [['','コマを判定'],['reviewed','採点する'],['unreadable','保留']]) state.add(option(value,label));
  state.value=decisions.status;
  const fields=frame.blocks.map((_,i)=>{
    const field=document.createElement('label');
    const select=document.createElement('select');
    select.add(option('','役割を選ぶ'));
    for(const [value,label] of types) select.add(option(value,label));
    select.value=decisions.roles[i];
    select.disabled=decisions.status==='unreadable';
    select.onchange=()=>{decisions.roles[i]=select.value;keep();};
    field.append(String(i+1),select);
    return field;
  });
  state.onchange=()=>{decisions.status=state.value;keep();show();};
  $('fields').replaceChildren(state,...fields);
}
$('work').onchange=updateFrames;
$('frame').onchange=show;
$('previous').onclick=()=>change(-1);
$('next').onclick=()=>change(1);
$('save').onclick=()=>{
  const works={};
  for(const work of bundle.works) {
    works[work.label]=[];
    for(const frame of work.frames) {
      const item=records[work.label+'/'+frame.frame];
      if(!item?.status || (item.status==='reviewed' && item.roles.some(role=>!role))) {
        $('status').value='未入力 '+work.label+' '+frame.frame+'F';
        return;
      }
      works[work.label].push({frame:frame.frame,status:item.status,roles:item.status==='unreadable'?[]:item.roles});
    }
  }
  const url=URL.createObjectURL(new Blob([JSON.stringify({reviewId:bundle.reviewId,works},null,2)],{type:'application/json'}));
  const link=document.createElement('a');
  link.href=url;link.download='style-text-roles.json';link.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  $('status').value='役割の判定を保存しました';
};
if(bundle.works.length) updateFrames();
else {
  for(const id of ['previous','next','save']) $(id).disabled=true;
  $('status').value='採点用のコマがありません';
}
</script>
